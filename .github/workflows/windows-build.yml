name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          flutter-version: '3.47.4'
          channel: stable
          
      - name: Print outputs
        shell: bash
        run: |
          echo CACHE-PATH=${{ steps.flutter-action.outputs.CACHE-PATH }}
          echo CACHE-KEY=${{ steps.flutter-action.outputs.CACHE-KEY }}
          echo CHANNEL=${{ steps.flutter-action.outputs.CHANNEL }}
          echo VERSION=${{ steps.flutter-action.outputs.VERSION }}
          echo ARCHITECTURE=${{ steps.flutter-action.outputs.ARCHITECTURE }}
          echo PUB-CACHE-PATH=${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}
          echo PUB-CACHE-KEY=${{ steps.flutter-action.outputs.PUB-CACHE-KEY }}
          echo CACHE-HIT=${{ steps.flutter-action.outputs.CACHE-HIT }}
          echo PUB-CACHE-HIT=${{ steps.flutter-action.outputs.PUB-CACHE-HIT }}

      - name: Build Windows executable (release)
        env:
          FLUTTER_WEB_ENABLE_WASM_EXCEPTION_CATCHING: false
          WEB_WORKER_EXPERIMENTAL_SAFARI_SUPPORT: true
        shell: bash
        run: |
          cd app && flutter pub get
          # Disable sound effects and GPU acceleration for desktop builds
          flutter build windows --release

      - name: Bundle executable with DLLs into zip file
        shell: pwsh
        run: |
          $releaseDir = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            Write-Error "Release directory not found: $releaseDir"
            exit 1
          }
          # Use relative paths so 7z stores every file flat at the zip root.
          $files = @((Get-ChildItem -Path $releaseDir -Filter *.dll).Name) + "solar_planner.exe"
          # 7z needs the working directory set to the release folder for relative names.
          $zipPath = Join-Path (Get-Location) "app/solar_planner_setup.zip"
          Push-Location $releaseDir
          try {
            & 7z a -ba $zipPath $files
          } finally {
            Pop-Location
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Error "7z failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path "app/solar_planner_setup.zip")) {
            Write-Error "Archive app/solar_planner_setup.zip was not created"
          }

          Write-Host "::notice::Archive created: app/solar_planner_setup.zip"

      - name: Upload Windows executable bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-planner-setup-windows
          path: app/solar_planner_setup.zip
          retention-days: 30
