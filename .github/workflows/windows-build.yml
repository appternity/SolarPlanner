name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Build Windows executable (release)
        env:
          FLUTTER_WEB_ENABLE_WASM_EXCEPTION_CATCHING: false
          WEB_WORKER_EXPERIMENTAL_SAFARI_SUPPORT: true
        shell: bash
        run: |
          cd app && flutter pub get
          # Disable sound effects and GPU acceleration for desktop builds
          flutter build windows --release

      - name: Bundle executable with DLLs into zip file
        shell: cmd
        run: >-
          7z a "app\solar_planner_setup.zip"
            "app\build\windows\x64\runner\Release\*.dll"
            "app\build\windows\x64\runner\Release\solar_planner.exe"

      - name: Upload Windows executable bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-planner-setup-windows
          path: app/solar_planner_setup.zip
          retention-days: 30
