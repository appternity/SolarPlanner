name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      # Cache the Windows build bundle (exe + DLLs) to avoid rebuilding on every push
      - name: Restore cached Windows build
        id: cache-windows-build
        uses: actions/cache@v5
        with:
          path: |
            app/build/windows/x64/runner/release/*.dll
            app/build/windows/x64/runner/release/solar_planner.exe
          key: windows-release-${{ hashFiles('app/lib/**.dart', 'pubspec.yaml') }}

      - name: Build Windows executable (release)
        if: steps.cache-windows-build.outputs.cache-hit != 'true'
        env:
          FLUTTER_WEB_ENABLE_WASM_EXCEPTION_CATCHING: false
          WEB_WORKER_EXPERIMENTAL_SAFARI_SUPPORT: true
        shell: bash
        run: |
          cd app && flutter pub get
          # Disable sound effects and GPU acceleration for desktop builds
          flutter build windows --release

      - name: Upload Windows executable as artifact (for manual testing)
        if: steps.cache-windows-build.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: solar_planner-setup
          path: |
            app/build/windows/x64/runner/release/solar_planner.exe
            app/build/windows/x64/runner/release/*.dll

      - name: Upload cached bundle (for download)
        if: steps.cache-windows-build.outputs.cache-hit == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: solar_planner-setup-cached
          path: |
            app/build/windows/x64/runner/release/solar_planner.exe
            app/build/windows/x64/runner/release/*.dll

  # Optional: nightly build that always rebuilds (useful for testing cache invalidation)
  build-windows-nightly:
    runs-on: windows-latest
    if: github.event_name == 'schedule' && github.repository_owner == 'appternity'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Build Windows executable (release)
        env:
          FLUTTER_WEB_ENABLE_WASM_EXCEPTION_CATCHING: false
          WEB_WORKER_EXPERIMENTAL_SAFARI_SUPPORT: true
        shell: bash
        run: |
          cd app && flutter pub get
          # Disable sound effects and GPU acceleration for desktop builds
          flutter build windows --release

      - name: Upload Windows executable as artifact (nightly)
        uses: actions/upload-artifact@v4
        with:
          name: solar_planner-setup-nightly
          path: |
            app/build/windows/x64/runner/release/solar_planner.exe
            app/build/windows/x64/runner/release/*.dll

      - name: Upload artifact to GitHub Releases (nightly)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            app/build/windows/x64/runner/release/solar_planner.exe
            app/build/windows/x64/runner/release/*.dll

